<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chart Editor</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#202020;
}

#editor{
    width:500px;
    height:700px;
    display:grid;
    grid-template-columns:repeat(20,1fr);
    border:2px solid #ffffff;
    background:#111111;
}

.lane{
    border-left:1px solid #555555;
}

.lane:first-child{
    border-left:none;
}
</style>

</head>
<body>

<div id="editor"></div>

<script>
const editor = document.getElementById("editor");

for(let i = 0; i < 20; i++){
    const lane = document.createElement("div");
    lane.className = "lane";
    editor.appendChild(lane);
}
</script>

</body>
</html>
