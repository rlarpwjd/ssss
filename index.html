<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Chart Editor</title>
<style>

    
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
    
body{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#202020;
}

/* 좌측 조작 패널 */
#control-panel{
    width:180px;
    height:700px;
    background:#303030;
    color:white;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* 버튼 */
button{
    padding:8px;
    cursor:pointer;
}

/* 화면에 보이는 창 */
#editor-container{
    width:700px;
    height:900px;
    overflow-y:auto;
    overflow-x:hidden;
    border:2px solid white;
}
    
/* 실제 채보 공간 */
#editor{
    width:100%;
    height:100000px;
    display:grid;
    grid-template-columns:repeat(20,1fr);
    background:#111;
    position:relative;
}

/* 레인 */
.lane{
    border-left:1px solid #555;
}
    
.lane:first-child{
    border-left:none;
}

/* 시간선 */
.beat-line{
    position:absolute;
    left:0;
    width:100%;
    height:1px;
    background:white;
}

.beat-line-strong{
    height:3px;
    background:white;
}

/* 0초 기준 파란선 */
#start-line{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:3px;
    background:blue;
}

/* 현재 재생 위치 빨간선 */
#play-line{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:3px;
    background:red;
}

#note-panel{
    width:100px;
    height:700px;
    background:#303030;
    color:white;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* 선택된 노트 버튼 강조 */
.note-type.selected{
    background:yellow;
    color:black;
}

/* 배치된 노트 */
.note{
    position:absolute;
    height:10px;
    background:orange;
    border-radius:3px;
}

</style>
</head>
<body>

<!-- 좌측 패널 -->
<div id="control-panel">
    
<button id="load-music">
노래 추가
</button>
    
<input 
type="file"
id="music-file"
accept="audio/*"
hidden
>

<button id="play">
시작
</button>

<button id="pause">
일시정지
</button>
    
<button id="reset">
초기화
</button>

<hr>

<div>
박자 변경
</div>

<button class="division" data-value="4">
1/4
</button>

<button class="division" data-value="8">
1/8
</button>

<button class="division" data-value="16">
1/16
</button>

<button class="division" data-value="32">
1/32
</button>

<button class="division" data-value="64">
1/64
</button>
    
<button class="division" data-value="128">
1/128
</button>

</div>

<!-- 에디터 -->
<div id="editor-container">
<div id="editor">
<div id="start-line"></div>
<div id="play-line"></div>
</div>
</div>

<!-- 우측 노트 패널 -->
<div id="note-panel">

<div>노트 종류</div>

<button class="note-type" data-note="a">A</button>
<button class="note-type" data-note="b">B</button>
<button class="note-type" data-note="c">C</button>
<button class="note-type" data-note="d">D</button>
<button class="note-type" data-note="e">E</button>
<button class="note-type" data-note="f">F</button>
<button class="note-type" data-note="g">G</button>
<button class="note-type" data-note="h">H</button>

</div>


<script>
const editor =
document.getElementById("editor");
const playLine =
document.getElementById("play-line");
const musicFile =
document.getElementById("music-file");
const audio =
new Audio();

/*
시간 설정
1/4 = 1초
*/
let division = 4;
const beatTime = {
4:1000,
8:500,
16:250,
32:125,
64:62.5,
128:31.25
};

/*
1초당 화면 이동 거리
*/
const timeHeight = 200;

/*
20레인 생성
*/
for(let i=0;i<20;i++){
    const lane =
    document.createElement("div");
    lane.className="lane";
    editor.appendChild(lane);
}

/*
시간선 생성
기본:
1초마다 흰색 선
*/
drawBeatLines();

/*
노래 추가 버튼
*/
document
.getElementById("load-music")
.onclick=()=>{
    musicFile.click();
};

musicFile.onchange=e=>{
    const file =
    e.target.files[0];
    if(file){
        audio.src =
        URL.createObjectURL(file);
    }
};

/*
재생
*/
document
.getElementById("play")
.onclick=()=>{
    audio.play();
    animateLine();
};

/*
일시정지
*/
document
.getElementById("pause")
.onclick=()=>{
    audio.pause();
};

/*
초기화
*/
document
.getElementById("reset")
.onclick=()=>{
    audio.currentTime=0;
    updateLine();
};

/*
박자 변경
*/
document
.querySelectorAll(".division")
.forEach(button=>{
    button.onclick=()=>{
        division =
        button.dataset.value;
        drawBeatLines();
        console.log(
        "현재 박자 : 1/"+division
        );
    };
});

/*
빨간선 부드럽게 이동시키는 함수
재생 중일 때만 계속 실행됨
*/
function animateLine(){
    updateLine();
    if(!audio.paused){
        requestAnimationFrame(animateLine);
    }
}


function updateLine(){
    let time =
    audio.currentTime;
    let y =
    time*timeHeight;
    playLine.style.bottom=
    y+"px";
    console.log("빨간선 위치:", y, "px", "/ 현재시간:", time, "초");
}

/*
흰색 줄 그리기 함수
division에 맞는 간격으로 다시 그림
4의 배수 줄은 굵게 표시
*/
function drawBeatLines(){

    // 기존 흰색 줄 전부 제거
    document
    .querySelectorAll(".beat-line")
    .forEach(line => line.remove());

    // 이번 박자의 초 단위 간격 계산
    const intervalSec = beatTime[division] / 1000;

    // 초 단위 간격 * timeHeight = px 간격
    const pxInterval = intervalSec * timeHeight;
    let count = 1;   // 몇 번째 줄인지 세는 변수
    for(
    let y = pxInterval;
    y < 100000;
    y += pxInterval
    ){
        const line =
        document.createElement("div");
        line.className = "beat-line";

        // 4번째 줄마다 굵은 줄 클래스 추가
        if(count % 4 === 0){
            line.classList.add("beat-line-strong");
        }
        line.style.bottom = y + "px";
        editor.appendChild(line);
        count++;
    }
}

let selectedNote = null;   // 현재 선택된 노트 종류

document
.querySelectorAll(".note-type")
.forEach(button=>{
    button.onclick=()=>{

        // 기존 선택 표시 다 지우고
        document
        .querySelectorAll(".note-type")
        .forEach(b=>b.classList.remove("selected"));

        // 지금 누른 버튼만 선택 표시
        button.classList.add("selected");

        selectedNote = button.dataset.note;

    };
});

editor.addEventListener("click", e=>{

    // 선택된 노트가 없으면 아무것도 안 함
    if(!selectedNote) return;

    // 클릭한 지점의 에디터 내부 좌표 계산
    const rect = editor.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickYFromTop = e.clientY - rect.top;

    // 흰 선/빨간 선처럼 bottom 기준 좌표로 변환
    const clickYFromBottom = editor.offsetHeight - clickYFromTop;

    // 가장 가까운 흰색 줄 위치로 스냅(딱 붙임)
    const intervalSec = beatTime[division] / 1000;
    const pxInterval = intervalSec * timeHeight;
    const snappedY = Math.round(clickYFromBottom / pxInterval) * pxInterval;

    // 클릭한 x좌표로 레인 번호 계산 (20레인 기준)
    const laneWidth = editor.offsetWidth / 20;
    const laneIndex = Math.floor(clickX / laneWidth);

    // 노트 요소 생성
    const note = document.createElement("div");
    note.className = "note note-" + selectedNote;
    note.style.bottom = snappedY + "px";
    note.style.left = (laneIndex * laneWidth) + "px";
    note.style.width = laneWidth + "px";

    // 나중에 저장/불러오기할 때 쓸 데이터
    note.dataset.note = selectedNote;
    note.dataset.time = snappedY / timeHeight;
    note.dataset.lane = laneIndex;

    editor.appendChild(note);

});
</script>
</body>
</html>
