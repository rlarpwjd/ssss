<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Chart Editor</title>
<style>

    
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
    
body{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#202020;
}

/* 좌측 조작 패널 */
#control-panel{
    width:180px;
    height:700px;
    background:#303030;
    color:white;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* 버튼 */
button{
    padding:8px;
    cursor:pointer;
}

/* 화면에 보이는 창 */
#editor-container{
    width:700px;
    height:900px;
    overflow-y:auto;
    overflow-x:hidden;
    border:2px solid white;
}
    
/* 실제 채보 공간 */
#editor{
    width:100%;
    height:100000px;
    display:grid;
    grid-template-columns:repeat(20,1fr);
    background:#111;
    position:relative;
}

/* 레인 */
.lane{
    border-left:1px solid #555;
}
    
.lane:first-child{
    border-left:none;
}

/* 시간선 */
.beat-line{
    position:absolute;
    left:0;
    width:100%;
    height:1px;
    background:white;
}

.beat-line-strong{
    height:3px;
    background:white;
}

/* 0초 기준 파란선 */
#start-line{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:3px;
    background:blue;
}

/* 현재 재생 위치 빨간선 */
#play-line{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:3px;
    background:red;
}

</style>
</head>
<body>

<!-- 좌측 패널 -->
<div id="control-panel">
    
<button id="load-music">
노래 추가
</button>
    
<input 
type="file"
id="music-file"
accept="audio/*"
hidden
>

<button id="play">
시작
</button>

<button id="pause">
일시정지
</button>
    
<button id="reset">
초기화
</button>

<hr>

<div>
박자 변경
</div>

<button class="division" data-value="4">
1/4
</button>

<button class="division" data-value="8">
1/8
</button>

<button class="division" data-value="16">
1/16
</button>

<button class="division" data-value="32">
1/32
</button>

<button class="division" data-value="64">
1/64
</button>
    
<button class="division" data-value="128">
1/128
</button>

</div>

<!-- 에디터 -->
<div id="editor-container">
<div id="editor">
<div id="start-line"></div>
<div id="play-line"></div>
</div>
</div>


<script>
const editor =
document.getElementById("editor");
const playLine =
document.getElementById("play-line");
const musicFile =
document.getElementById("music-file");
const audio =
new Audio();

/*
시간 설정
1/4 = 1초
*/
let division = 4;
const beatTime = {
4:1000,
8:500,
16:250,
32:125,
64:62.5,
128:31.25
};

/*
1초당 화면 이동 거리
*/
const timeHeight = 100;

/*
20레인 생성
*/
for(let i=0;i<20;i++){
    const lane =
    document.createElement("div");
    lane.className="lane";
    editor.appendChild(lane);
}

/*
시간선 생성
기본:
1초마다 흰색 선
*/
drawBeatLines();

/*
노래 추가 버튼
*/
document
.getElementById("load-music")
.onclick=()=>{
    musicFile.click();
};

musicFile.onchange=e=>{
    const file =
    e.target.files[0];
    if(file){
        audio.src =
        URL.createObjectURL(file);
    }
};

/*
재생
*/
document
.getElementById("play")
.onclick=()=>{
    audio.play();
    animateLine();
};

/*
일시정지
*/
document
.getElementById("pause")
.onclick=()=>{
    audio.pause();
};

/*
초기화
*/
document
.getElementById("reset")
.onclick=()=>{
    audio.currentTime=0;
    updateLine();
};

/*
박자 변경
*/
document
.querySelectorAll(".division")
.forEach(button=>{
    button.onclick=()=>{
        division =
        button.dataset.value;
        drawBeatLines();
        console.log(
        "현재 박자 : 1/"+division
        );
    };
});

/*
빨간선 부드럽게 이동시키는 함수
재생 중일 때만 계속 실행됨
*/
function animateLine(){
    updateLine();
    if(!audio.paused){
        requestAnimationFrame(animateLine);
    }
}


function updateLine(){
    let time =
    audio.currentTime;
    let y =
    time*timeHeight;
    playLine.style.bottom=
    y+"px";
    console.log("빨간선 위치:", y, "px", "/ 현재시간:", time, "초");
}

/*
흰색 줄 그리기 함수
division에 맞는 간격으로 다시 그림
4의 배수 줄은 굵게 표시
*/
function drawBeatLines(){

    // 기존 흰색 줄 전부 제거
    document
    .querySelectorAll(".beat-line")
    .forEach(line => line.remove());

    // 이번 박자의 초 단위 간격 계산
    const intervalSec = beatTime[division] / 1000;

    // 초 단위 간격 * timeHeight = px 간격
    const pxInterval = intervalSec * timeHeight;
    let count = 1;   // 몇 번째 줄인지 세는 변수
    for(
    let y = pxInterval;
    y < 100000;
    y += pxInterval
    ){
        const line =
        document.createElement("div");
        line.className = "beat-line";

        // 4번째 줄마다 굵은 줄 클래스 추가
        if(count % 4 === 0){
            line.classList.add("beat-line-strong");
        }
        line.style.bottom = y + "px";
        editor.appendChild(line);
        count++;
    }
}
</script>
</body>
</html>
