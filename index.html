<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Chart Editor</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#202020;
}

#editor{
    width:500px;
    height:700px;
    display:grid;
    grid-template-columns:repeat(20,1fr);
    border:2px solid white;
    background:#111;
    position:relative;
}

.lane{
    border-left:1px solid #555;
}

.lane:first-child{
    border-left:none;
}


/* 박자 가로줄 */
.beat-line{
    position:absolute;
    left:0;
    width:100%;
    height:1px;
    background:white;
    z-index:5;
}


/* 마지막 박자 줄 */
.measure-line{
    height:3px;
}

</style>

</head>

<body>

<div id="editor"></div>


<script>

const editor = document.getElementById("editor");


// 20레인 생성
for(let i = 0; i < 20; i++){

    const lane = document.createElement("div");

    lane.className = "lane";

    editor.appendChild(lane);

}



// 4/4 박자 가로줄 생성
const editorHeight = 700;


// 한 박자의 간격
// 4박 기준 한 마디 = 4줄
const beatDistance = 50;



let beatCount = 0;


for(let y = beatDistance; y < editorHeight; y += beatDistance){

    const line = document.createElement("div");

    line.className = "beat-line";

    line.style.top = y + "px";


    // 4번째 박자마다 굵은 줄
    beatCount++;

    if(beatCount % 4 === 0){

        line.classList.add("measure-line");

    }


    editor.appendChild(line);

}


</script>

</body>
</html>
