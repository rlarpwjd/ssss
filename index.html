<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>20Lane Chart Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="topbar">

<input type="number" id="bpm" value="120">

<input type="file" id="music" accept="audio/*">

<button id="clear">채보 초기화</button>

<span id="time">0.000</span>

</div>

<div id="timeline"></div>

<canvas id="preview" width="1000" height="500"></canvas>

<script src="script.js"></script>

</body>
</html>
