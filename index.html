<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Chart Editor</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#202020;
}


/* 화면에 보이는 창 */
#editor-container{

    width:500px;
    height:700px;

    overflow-y:auto;

    border:2px solid white;

}


/* 실제 채보 공간 */
#editor{

    width:500px;

    height:100000px;

    display:grid;

    grid-template-columns:repeat(20,1fr);

    background:#111;

    position:relative;

}


.lane{

    border-left:1px solid #555;

}


.lane:first-child{

    border-left:none;

}


/* 박자선 */
.beat-line{

    position:absolute;

    left:0;

    width:100%;

    height:1px;

    background:white;

}


.measure-line{

    height:3px;

}

</style>

</head>


<body>


<div id="editor-container">

    <div id="editor"></div>

</div>



<script>


const editor=document.getElementById("editor");


// 20레인 생성

for(let i=0;i<20;i++){

    const lane=document.createElement("div");

    lane.className="lane";

    editor.appendChild(lane);

}



// 박자선 생성

const beatDistance=50;


for(let y=beatDistance;y<100000;y+=beatDistance){


    const line=document.createElement("div");

    line.className="beat-line";


    line.style.top=y+"px";


    editor.appendChild(line);


}


</script>


</body>
</html>
